<!DOCTYPE html>
<html>
    <head>
        <title>Big Bite Task</title>
        <style>

            * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
}

            
            body {
            display: flex;
           justify-content: center;
           align-items: center;
           min-height: 100vh;
           background-color: #f0f2f5; /* Light Gray */
           font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
           transition: background 0.4s ease;

           .card {
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            background:rgba(150, 150, 177, 0.877);
            padding:50px;
            border-radius: 20px;
            
           }
           .profile-img {
            height:100px;
            width:100px;
            object-fit:cover;
            border-radius:50%           
           }
           .btn {
            display:flex;
            flex-direction:column;
            width:auto;
           padding:20px;
           justify-content:center;
           border-radius:50px;
           border:none

           }
           .me {
            width: 200px;
            background-color: #007bff;
            border: none;


           


           }

           


  
}
        </style>
    </head>
    <body>
        <main class="card">
            <img class="profile-img" src="wisdom1.jpg" />
            <h1>Wisdom Chede</h1>
            <p>Student Developer </p>
            <div class="btn">
                <button class="me">Linkdin</button>
                <button class="me">Github</button>
                <button>My Projects</button>

            </div>
            

            </div>

        </main>
        
    </body>
</html>
